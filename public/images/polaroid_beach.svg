<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-polaroid_beach.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg-polaroid_beach.svg)"/>
  <circle cx="300" cy="240" r="140" fill="#ffffff" opacity="0.35" filter="url(#soft-glow)"/>
  <text x="300" y="270" font-size="110" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🌅</text>
  <text x="300" y="380" font-size="28" font-weight="bold" fill="#5c2638" text-anchor="middle" font-family="system-ui, sans-serif">Senja di Pantai</text>
  <text x="300" y="420" font-size="18" fill="#8a4b60" text-anchor="middle" font-family="system-ui, sans-serif">Momen Berdua</text>
  <rect x="220" y="460" width="160" height="34" rx="17" fill="#ffffff" opacity="0.6"/>
  <text x="300" y="483" font-size="13" font-weight="600" fill="#db2777" text-anchor="middle" font-family="system-ui, sans-serif">✨ Ganti Foto Disini</text>
</svg>